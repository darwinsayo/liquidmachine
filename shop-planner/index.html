<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Layout Planner | Liquid Machine</title>
<meta name="description" content="A drag-and-drop floor plan tool for a woodworking and laser shop, built by Liquid Machine.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: drafting-sheet plan on the left, piece list and controls on the right; stacks on phones. */
:root {
  --bg: #e6ebe9;
  --surface: #f5f8f7;
  --ink: #1b2a2f;
  --muted: #566a70;
  --line: #c3cfcc;
  --grid: #d9e2df;
  --accent: #0b6e8a;
  --warn: #c22a2a;
  --zone: rgba(11, 110, 138, 0.10);
  --door: #0b6e8a;
  --outlet: #d62f2f;
  --piece-ink: #1b2a2f;
  --bench: #dcbf92;
  --machine: #86c1bb;
  --tool: #f2a65a;
  --shelf: #b4bec9;
  --small: #cdd6c2;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181b;
    --surface: #192024;
    --ink: #e3ebe8;
    --muted: #92a3a8;
    --line: #34434b;
    --grid: #232e34;
    --accent: #5cc2de;
    --warn: #ff7a7a;
    --zone: rgba(92, 194, 222, 0.12);
    --door: #5cc2de;
    --outlet: #ff6b6b;
    --piece-ink: #f0f5f3;
    --bench: #7a6340;
    --machine: #2f6b67;
    --tool: #a4602a;
    --shelf: #485563;
    --small: #4d5c49;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181b;
  --surface: #192024;
  --ink: #e3ebe8;
  --muted: #92a3a8;
  --line: #34434b;
  --grid: #232e34;
  --accent: #5cc2de;
  --warn: #ff7a7a;
  --zone: rgba(92, 194, 222, 0.12);
  --door: #5cc2de;
  --outlet: #ff6b6b;
  --piece-ink: #f0f5f3;
  --bench: #7a6340;
  --machine: #2f6b67;
  --tool: #a4602a;
  --shelf: #485563;
  --small: #4d5c49;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.4;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-family: var(--font-mono); font-size: 13px; }
.status {
  font-family: var(--font-mono); font-size: 13px; padding: 4px 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.status { white-space: nowrap; }
.status.bad { color: var(--warn); border-color: var(--warn); }
.status.ok { color: var(--accent); border-color: var(--accent); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.plan { background: var(--surface); border: 1px solid var(--line); padding: 8px; min-width: 0; }
.plan svg { display: block; width: 100%; height: calc(100vh - 150px); min-height: 520px; user-select: none; -webkit-user-select: none; }
.zoombar { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; }
.zoombar button { min-width: 42px; padding: 5px 12px; font-size: 16px; }
.zoombar .zl { font-family: var(--font-mono); font-size: 13px; color: var(--muted); min-width: 48px; }
.hint { margin: 6px 4px 2px; color: var(--muted); font-size: 13px; }

.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 12px; }
.card h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.sel-name { font-size: 18px; font-weight: 600; margin: 0; }
.sel-size { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
.sel-flags { color: var(--warn); font-size: 13px; margin: 0 0 10px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  padding: 7px 12px; cursor: pointer; min-height: 38px;
}
button:hover { border-color: var(--accent); }
button:focus-visible, .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.danger:hover { border-color: var(--warn); color: var(--warn); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); padding: 0 4px; margin-left: 4px; color: var(--muted); }

ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 4px 0; min-width: 0; }
.row:first-child { border-top: 0; }
.row.sel { background: var(--zone); }
.pick { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 4px; min-height: 34px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pick .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .dim { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.row .pill { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); padding: 0 5px; white-space: nowrap; }
.row .mini { min-height: 30px; padding: 3px 8px; font-size: 13px; }
.row.removed .nm { text-decoration: line-through; color: var(--muted); }
.swatch { width: 10px; height: 10px; flex: none; border: 1px solid var(--ink); }

/* plan drawing */
.piece { cursor: grab; touch-action: none; }
.piece:active { cursor: grabbing; }
.piece rect { stroke: var(--ink); stroke-width: 0.5; fill: var(--c); }
.piece.sel rect { stroke: var(--accent); stroke-width: 1.8; }
.piece.bad rect { stroke: var(--warn); stroke-width: 1.3; stroke-dasharray: 3 1.5; }
.piece text { fill: var(--piece-ink); pointer-events: none; font-family: var(--font-ui); font-weight: 500; }
.piece text.d { font-family: var(--font-mono); font-weight: 400; opacity: 0.85; }
.cat-bench { --c: var(--bench); }
.cat-machine { --c: var(--machine); }
.cat-tool { --c: var(--tool); }
.cat-shelf { --c: var(--shelf); }
.cat-small { --c: var(--small); }
.t-note { fill: var(--muted); font-family: var(--font-ui); }
.t-mono { fill: var(--muted); font-family: var(--font-mono); }
.t-zone { fill: var(--accent); font-family: var(--font-ui); }

@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .plan svg { height: 78vh; min-height: 460px; }
  h1 { font-size: 23px; }
  header { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: no-preference) {
  .piece rect { transition: stroke 0.12s; }
}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Shop Layout Planner</h1>
      <p class="sub">231 × 275 in · 19′3″ × 22′11″</p>
    </div>
    <div class="status ok" id="status" role="status">All clear</div>
  </header>

  <div class="stage">
    <div class="plan">
      <div class="zoombar">
        <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
        <button id="zin" type="button" aria-label="Zoom in">+</button>
        <button id="zfit" type="button" aria-label="Fit whole room">Fit</button>
        <span class="zl" id="zlabel">100%</span>
      </div>
      <svg id="svg" viewBox="-18 -22 267 334" role="img" aria-label="Top-down plan of the shop with movable furniture and equipment">
        <g id="static"></g>
        <g id="openings" pointer-events="none"></g>
        <g id="pieces"></g>
        <g id="over" pointer-events="none"></g>
      </svg>
      <p class="hint">Drag a piece to move it. Click one, then use Rotate or Remove. Arrow keys nudge it 1 in. Zoom with the buttons (or + and −), then drag empty floor to pan. Dashed outlines turn red when pieces overlap or block the walkway.</p>
    </div>

    <aside class="side">
      <section class="card" id="selCard" aria-live="polite"></section>
      <section class="card">
        <h2>Pieces</h2>
        <ul class="list" id="list"></ul>
      </section>
      <div class="btns"><button id="reset" type="button">Reset layout</button></div>
    </aside>
  </div>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var ROOM = { w: 231, h: 275 };
  var STORE = 'shop-layout-planner-v2';

  // Real sizes in inches, in plan orientation (w across, h down). Positions are a starting arrangement.
  var DEFAULTS = [
    { id: 'lbl', name: 'L bench, left wall', label: 'L bench', w: 24, h: 72, x: 0, y: 0, cat: 'bench' },
    { id: 'lbf', name: 'L bench, far wall', label: 'L bench', w: 53, h: 24, x: 24, y: 0, cat: 'bench' },
    { id: 'bn1', name: 'Long bench 1', label: 'Bench 1', w: 24, h: 72, x: 0, y: 76, cat: 'bench' },
    { id: 'bn2', name: 'Long bench 2', label: 'Bench 2', w: 24, h: 72, x: 0, y: 152, cat: 'bench' },
    { id: 'cnc', name: 'CNC table', label: 'CNC table', w: 48, h: 70, x: 66, y: 129, cat: 'machine' },
    { id: 'las', name: 'Laser table', label: 'Laser table', w: 32, h: 92, x: 199, y: 100, cat: 'machine' },
    { id: 'tbs', name: 'Small toolbox', label: 'Small toolbox', w: 18, h: 35, x: 0, y: 232, cat: 'tool' },
    { id: 'tbl', name: 'Large toolbox', label: 'Large toolbox', w: 21, h: 38, x: 125, y: 235, cat: 'tool' },
    { id: 'sh1', name: 'Shelf 1', label: 'Shelf', w: 24, h: 48, x: 118, y: 129, cat: 'shelf' },
    { id: 'sh2', name: 'Shelf 2', label: 'Shelf', w: 24, h: 48, x: 118, y: 181, cat: 'shelf' },
    { id: 'sh3', name: 'Shelf 3', label: 'Shelf', w: 48, h: 24, x: 66, y: 203, cat: 'shelf' },
    { id: 'sh4', name: 'Shelf 4', label: 'Shelf', w: 48, h: 24, x: 66, y: 231, cat: 'shelf' },
    { id: 'sh5', name: 'Shelf 5', label: 'Shelf', w: 48, h: 24, x: 66, y: 101, cat: 'shelf' },
    { id: 'frg', name: 'Fridge', label: 'Fridge', w: 27, h: 24, x: 125, y: 0, cat: 'small', door: { side: 'b', depth: 27 } },
    { id: 'bks', name: 'Bookshelf', label: 'Bookshelf', w: 12, h: 32, x: 219, y: 10, cat: 'small' },
    { id: 'cbf', name: 'Cubby by fridge', label: 'Cubby', w: 12, h: 17, x: 100, y: 0, cat: 'small' },
    { id: 'cb1', name: 'Cubby 1', label: 'Cubby', w: 11, h: 16, x: 77, y: 0, cat: 'small' },
    { id: 'cb2', name: 'Cubby 2', label: 'Cubby', w: 11, h: 16, x: 88, y: 0, cat: 'small' },
    { id: 'cb3', name: 'Cubby 3', label: 'Cubby', w: 11, h: 16, x: 220, y: 250, cat: 'small' }
  ];

  // Areas that must stay open.
  var ZONES = [
    { id: 'path', name: 'the 36 in walkway', x: 157, y: 0, w: 36, h: 275 },
    { id: 'panel', name: 'the electrical panel', x: 200, y: 0, w: 19, h: 36 }
  ];

  var pieces = DEFAULTS.map(function (d) {
    return { id: d.id, name: d.name, label: d.label, cat: d.cat, w: d.w, h: d.h, x: d.x, y: d.y, removed: false, flags: [],
      door: d.door ? { side: d.door.side, depth: d.door.depth } : null };
  });
  var byId = {};
  pieces.forEach(function (p) { byId[p.id] = p; });
  var defById = {};
  DEFAULTS.forEach(function (d) { defById[d.id] = d; });
  var selected = null;
  var nodes = {};

  var svg = document.getElementById('svg');
  var gStatic = document.getElementById('static');
  var gPieces = document.getElementById('pieces');

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) { if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]); }
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, attrs, s) {
    var t = el('text', attrs, parent);
    t.textContent = s;
    return t;
  }
  function ft(n) {
    var f = Math.floor(n / 12), i = n % 12;
    var s = (f ? f + '′' : '') + (i ? i + '″' : '');
    return s || '0″';
  }

  /* ---------- static drawing ---------- */
  function drawStatic() {
    var i;
    // zones first (under everything)
    ZONES.forEach(function (z) {
      el('rect', { x: z.x, y: z.y, width: z.w, height: z.h, fill: 'var(--zone)', stroke: 'var(--accent)', 'stroke-width': 0.5, 'stroke-dasharray': '3 2' }, gStatic);
    });
    // room fill
    var room = el('rect', { x: 0, y: 0, width: ROOM.w, height: ROOM.h, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2 });
    // 1 ft grid
    for (i = 12; i < ROOM.w; i += 12) el('line', { x1: i, y1: 0, x2: i, y2: ROOM.h, stroke: 'var(--grid)', 'stroke-width': 0.35 }, gStatic);
    for (i = 12; i < ROOM.h; i += 12) el('line', { x1: 0, y1: i, x2: ROOM.w, y2: i, stroke: 'var(--grid)', 'stroke-width': 0.35 }, gStatic);
    gStatic.appendChild(room);

    // garage door (bottom wall), entry door (top), side door (right), window (right)
    el('line', { x1: 15, y1: ROOM.h, x2: 216, y2: ROOM.h, stroke: 'var(--door)', 'stroke-width': 3.2 }, gStatic);
    el('line', { x1: 155, y1: 0, x2: 195, y2: 0, stroke: 'var(--door)', 'stroke-width': 3.2 }, gStatic);
    el('line', { x1: ROOM.w, y1: 204, x2: ROOM.w, y2: 244, stroke: 'var(--door)', 'stroke-width': 3.2 }, gStatic);
    [46, 116].forEach(function (y0) {
      el('line', { x1: ROOM.w - 0.8, y1: y0, x2: ROOM.w - 0.8, y2: y0 + 39, stroke: 'var(--accent)', 'stroke-width': 1 }, gStatic);
      el('line', { x1: ROOM.w + 0.8, y1: y0, x2: ROOM.w + 0.8, y2: y0 + 39, stroke: 'var(--accent)', 'stroke-width': 1 }, gStatic);
      txt(gStatic, { x: ROOM.w + 5, y: y0 + 19.5, 'font-size': 4.2, class: 't-note', 'text-anchor': 'middle', transform: 'rotate(90 ' + (ROOM.w + 5) + ' ' + (y0 + 19.5) + ')' }, 'Window');
    });

    // labels
    txt(gStatic, { x: 175, y: -4, 'text-anchor': 'middle', 'font-size': 4.6, class: 't-note' }, 'Entry door');
    txt(gStatic, { x: 209.5, y: -4, 'text-anchor': 'middle', 'font-size': 4.6, class: 't-note' }, 'Panel');
    txt(gStatic, { x: 115, y: 288, 'text-anchor': 'middle', 'font-size': 5, class: 't-note' }, 'Garage door');
    txt(gStatic, { x: ROOM.w + 5, y: 224, 'font-size': 4.2, class: 't-note', 'text-anchor': 'middle', transform: 'rotate(90 ' + (ROOM.w + 5) + ' 224)' }, 'Side door');
    txt(gStatic, { x: 175, y: 150, 'text-anchor': 'middle', 'font-size': 5, class: 't-zone', transform: 'rotate(-90 175 150)' }, 'Keep 36 in open');

    // overall dimensions
    el('line', { x1: 0, y1: -12, x2: ROOM.w, y2: -12, stroke: 'var(--muted)', 'stroke-width': 0.4 }, gStatic);
    el('line', { x1: 0, y1: -14.5, x2: 0, y2: -9.5, stroke: 'var(--muted)', 'stroke-width': 0.4 }, gStatic);
    el('line', { x1: ROOM.w, y1: -14.5, x2: ROOM.w, y2: -9.5, stroke: 'var(--muted)', 'stroke-width': 0.4 }, gStatic);
    var tb = txt(gStatic, { x: 92, y: -14, 'text-anchor': 'middle', 'font-size': 4.6, class: 't-mono' }, '231 in');
    el('line', { x1: -10, y1: 0, x2: -10, y2: ROOM.h, stroke: 'var(--muted)', 'stroke-width': 0.4 }, gStatic);
    el('line', { x1: -12.5, y1: 0, x2: -7.5, y2: 0, stroke: 'var(--muted)', 'stroke-width': 0.4 }, gStatic);
    el('line', { x1: -12.5, y1: ROOM.h, x2: -7.5, y2: ROOM.h, stroke: 'var(--muted)', 'stroke-width': 0.4 }, gStatic);
    txt(gStatic, { x: -13, y: 137, 'text-anchor': 'middle', 'font-size': 4.6, class: 't-mono', transform: 'rotate(-90 -13 137)' }, '275 in');

    // scale bar: 10 ft
    el('rect', { x: 0, y: 298, width: 120, height: 3, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 0.5 }, gStatic);
    el('rect', { x: 0, y: 298, width: 60, height: 3, fill: 'var(--muted)' }, gStatic);
    txt(gStatic, { x: 0, y: 296, 'font-size': 4, class: 't-mono' }, '0');
    txt(gStatic, { x: 60, y: 296, 'font-size': 4, class: 't-mono', 'text-anchor': 'middle' }, '5 ft');
    txt(gStatic, { x: 120, y: 296, 'font-size': 4, class: 't-mono', 'text-anchor': 'end' }, '10 ft');
    txt(gStatic, { x: ROOM.w, y: 301, 'font-size': 4, class: 't-mono', 'text-anchor': 'end' }, 'Grid squares are 12 in');
    txt(gStatic, { x: ROOM.w, y: 308, 'font-size': 4, class: 't-mono', 'text-anchor': 'end' }, 'Red dots: wall outlets. Dashed ring: ceiling outlet.');
  }

  // Outlets sit above the pieces so they stay visible. Distances are from the top wall and left wall.
  function drawOver() {
    var gOver = document.getElementById('over');
    [[0, 75], [0, 239], [36.5, 0], [119, 0], [ROOM.w, 100.5]].forEach(function (o) {
      el('circle', { cx: o[0], cy: o[1], r: 2.6, fill: 'var(--outlet)', stroke: 'var(--surface)', 'stroke-width': 0.6 }, gOver);
    });
    el('circle', { cx: 90, cy: 164, r: 5.5, fill: 'none', stroke: 'var(--outlet)', 'stroke-width': 1.1, 'stroke-dasharray': '2.2 1.6' }, gOver);
  }

  /* ---------- pieces ---------- */
  function sizeText(p) { return p.w + '×' + p.h; }

  function drawPiece(p) {
    var g = nodes[p.id];
    while (g.firstChild) g.removeChild(g.firstChild);
    g.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ')');
    g.style.display = p.removed ? 'none' : '';
    el('rect', { x: 0, y: 0, width: p.w, height: p.h, rx: 0.8 }, g);
    var vertical = p.h > p.w * 1.25;
    var longAx = vertical ? p.h : p.w;
    var shortAx = vertical ? p.w : p.h;
    var fs = Math.min(6.2, shortAx / 2.9, longAx * 0.92 / (p.label.length * 0.52));
    if (fs < 2.6) fs = 2.6;
    var dims = sizeText(p);
    var dfs = fs * 0.78;
    var showDims = shortAx >= fs * 2.9 && dims.length * dfs * 0.62 <= longAx;
    var lg = el('g', { transform: 'translate(' + (p.w / 2) + ' ' + (p.h / 2) + ')' + (vertical ? ' rotate(-90)' : '') }, g);
    txt(lg, { x: 0, y: showDims ? -fs * 0.1 : 0, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': fs }, p.label);
    if (showDims) {
      txt(lg, { x: 0, y: fs * 0.95, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': dfs, class: 'd' }, dims);
    }
    updateClasses(p);
  }

  function updateClasses(p) {
    var g = nodes[p.id];
    var c = 'piece cat-' + p.cat;
    if (selected === p.id) c += ' sel';
    if (p.flags.length) c += ' bad';
    g.setAttribute('class', c);
  }

  function buildPieces() {
    pieces.forEach(function (p) {
      var g = el('g', { 'data-id': p.id, tabindex: '-1' }, gPieces);
      nodes[p.id] = g;
      g.addEventListener('pointerdown', function (e) { startDrag(e, p); });
      drawPiece(p);
    });
  }

  /* ---------- door-swing areas (fridge) ---------- */
  var gOpen = document.getElementById('openings');
  var openNodes = {};
  var SIDE_NEXT = { b: 'l', l: 't', t: 'r', r: 'b' }; // Rotate turns the piece clockwise
  function openingRect(p) {
    var d = p.door.depth;
    if (p.door.side === 'b') return { x: p.x, y: p.y + p.h, w: p.w, h: d };
    if (p.door.side === 't') return { x: p.x, y: p.y - d, w: p.w, h: d };
    if (p.door.side === 'l') return { x: p.x - d, y: p.y, w: d, h: p.h };
    return { x: p.x + p.w, y: p.y, w: d, h: p.h };
  }
  function updateOpenings() {
    pieces.forEach(function (p) {
      if (!p.door) return;
      var n = openNodes[p.id];
      if (!n) {
        n = openNodes[p.id] = { g: el('g', {}, gOpen) };
        n.rect = el('rect', { 'stroke-width': 0.5, 'stroke-dasharray': '3 2' }, n.g);
        n.text = txt(n.g, { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 3.8, class: 't-zone' }, p.label + ' door');
      }
      n.g.style.display = p.removed ? 'none' : '';
      var r = openingRect(p);
      var blocked = p.flags.some(function (f) { return f.indexOf('door blocked') === 0; });
      n.rect.setAttribute('x', r.x); n.rect.setAttribute('y', r.y);
      n.rect.setAttribute('width', r.w); n.rect.setAttribute('height', r.h);
      n.rect.setAttribute('fill', blocked ? 'var(--warn)' : 'var(--zone)');
      n.rect.setAttribute('fill-opacity', blocked ? 0.18 : 1);
      n.rect.setAttribute('stroke', blocked ? 'var(--warn)' : 'var(--accent)');
      var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      n.text.setAttribute('x', cx); n.text.setAttribute('y', cy);
      if (r.w < r.h * 0.8) n.text.setAttribute('transform', 'rotate(-90 ' + cx + ' ' + cy + ')');
      else n.text.removeAttribute('transform');
    });
  }

  /* ---------- overlap / clear-zone checks ---------- */
  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function analyze() {
    var bad = 0;
    pieces.forEach(function (p) { p.flags = []; });
    var act = pieces.filter(function (p) { return !p.removed; });
    for (var i = 0; i < act.length; i++) {
      for (var j = i + 1; j < act.length; j++) {
        if (hit(act[i], act[j])) {
          act[i].flags.push('overlaps ' + act[j].name);
          act[j].flags.push('overlaps ' + act[i].name);
        }
      }
      for (var k = 0; k < ZONES.length; k++) {
        if (hit(act[i], ZONES[k])) act[i].flags.push('blocks ' + ZONES[k].name);
      }
    }
    pieces.forEach(function (f) {
      if (!f.door || f.removed) return;
      var r = openingRect(f);
      act.forEach(function (q) {
        if (q !== f && hit(q, r)) {
          q.flags.push('blocks the ' + f.label.toLowerCase() + ' door');
          f.flags.push('door blocked by ' + q.name);
        }
      });
    });
    pieces.forEach(function (p) { if (p.flags.length) bad++; updateClasses(p); });
    updateOpenings();
    var st = document.getElementById('status');
    if (bad) {
      st.textContent = bad + (bad === 1 ? ' piece needs' : ' pieces need') + ' attention';
      st.className = 'status bad';
    } else {
      st.textContent = 'All clear';
      st.className = 'status ok';
    }
  }

  /* ---------- panels ---------- */
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function renderSel() {
    var card = document.getElementById('selCard');
    var p = selected ? byId[selected] : null;
    card.innerHTML = '';
    var h = document.createElement('h2');
    h.textContent = 'Selected';
    card.appendChild(h);
    if (!p || p.removed) {
      var m = document.createElement('p');
      m.style.margin = '0';
      m.style.color = 'var(--muted)';
      m.textContent = 'Click a piece on the plan or in the list to rotate or remove it.';
      card.appendChild(m);
      return;
    }
    var n = document.createElement('p'); n.className = 'sel-name'; n.textContent = p.name; card.appendChild(n);
    var s = document.createElement('p'); s.className = 'sel-size';
    s.textContent = p.w + ' × ' + p.h + ' in  (' + ft(p.w) + ' × ' + ft(p.h) + ')';
    card.appendChild(s);
    if (p.flags.length) {
      var f = document.createElement('p'); f.className = 'sel-flags';
      f.textContent = cap(p.flags.join('; ')) + '.';
      card.appendChild(f);
    }
    var b = document.createElement('div'); b.className = 'btns';
    var r = document.createElement('button'); r.type = 'button'; r.className = 'primary';
    r.innerHTML = 'Rotate <kbd>R</kbd>';
    r.addEventListener('click', function () { rotate(p); });
    var d = document.createElement('button'); d.type = 'button'; d.className = 'danger';
    d.innerHTML = 'Remove <kbd>Del</kbd>';
    d.addEventListener('click', function () { removePiece(p); });
    b.appendChild(r); b.appendChild(d);
    card.appendChild(b);
  }

  function renderList() {
    var ul = document.getElementById('list');
    ul.innerHTML = '';
    pieces.forEach(function (p) {
      var li = document.createElement('li');
      li.className = 'row' + (p.removed ? ' removed' : '') + (selected === p.id ? ' sel' : '');
      var sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = 'var(--' + p.cat + ')';
      li.appendChild(sw);
      var pick = document.createElement('button'); pick.type = 'button'; pick.className = 'pick';
      pick.innerHTML = '<span class="nm"></span><span class="dim"></span>';
      pick.firstChild.textContent = p.name;
      pick.lastChild.textContent = sizeText(p);
      pick.addEventListener('click', function () { if (!p.removed) select(p.id); });
      li.appendChild(pick);
      if (p.flags.length && !p.removed) {
        var pill = document.createElement('span'); pill.className = 'pill';
        pill.textContent = p.flags[0].indexOf('blocks') === 0 ? 'Blocks' : 'Overlap';
        li.appendChild(pill);
      }
      var act = document.createElement('button'); act.type = 'button'; act.className = 'mini';
      act.textContent = p.removed ? 'Put back' : 'Remove';
      act.setAttribute('aria-label', (p.removed ? 'Put back ' : 'Remove ') + p.name);
      act.addEventListener('click', function () { if (p.removed) restore(p); else removePiece(p); });
      li.appendChild(act);
      ul.appendChild(li);
    });
  }

  function refresh() {
    analyze();
    renderSel();
    renderList();
  }

  /* ---------- actions ---------- */
  function select(id) {
    var prev = selected;
    selected = id;
    if (prev && byId[prev]) updateClasses(byId[prev]);
    if (id && byId[id]) {
      updateClasses(byId[id]);
      if (gPieces.lastChild !== nodes[id]) gPieces.appendChild(nodes[id]); // bring to front
    }
    renderSel();
    renderList();
  }
  function clamp(p) {
    p.x = Math.max(0, Math.min(ROOM.w - p.w, p.x));
    p.y = Math.max(0, Math.min(ROOM.h - p.h, p.y));
  }
  function rotate(p) {
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    var t = p.w; p.w = p.h; p.h = t;
    if (p.door) p.door.side = SIDE_NEXT[p.door.side];
    p.x = Math.round(cx - p.w / 2);
    p.y = Math.round(cy - p.h / 2);
    clamp(p);
    drawPiece(p);
    refresh(); save();
  }
  function removePiece(p) {
    p.removed = true;
    if (selected === p.id) selected = null;
    drawPiece(p);
    refresh(); save();
  }
  function restore(p) {
    var d = defById[p.id];
    p.w = d.w; p.h = d.h; p.x = d.x; p.y = d.y; p.removed = false;
    if (d.door) p.door.side = d.door.side;
    drawPiece(p);
    select(p.id);
    refresh(); save();
  }

  /* ---------- dragging ---------- */
  var drag = null;
  var pan = null;
  function toSvg(e) {
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function startDrag(e, p) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    var g = nodes[p.id];
    select(p.id); // reorders the piece to the front, so do it before capturing the pointer
    var pt = toSvg(e);
    drag = { p: p, ox: pt.x - p.x, oy: pt.y - p.y, moved: false, id: e.pointerId, g: g };
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    g.addEventListener('pointermove', onMove);
    g.addEventListener('pointerup', onUp);
    g.addEventListener('pointercancel', onUp);
    g.addEventListener('lostpointercapture', onUp);
  }
  function onMove(e) {
    if (!drag) return;
    var pt = toSvg(e), p = drag.p;
    var nx = Math.round(pt.x - drag.ox), ny = Math.round(pt.y - drag.oy);
    var ox = p.x, oy = p.y;
    p.x = nx; p.y = ny; clamp(p);
    if (p.x !== ox || p.y !== oy) {
      drag.moved = true;
      drag.g.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ')');
      analyze();
    }
  }
  function onUp() {
    if (!drag) return;
    var g = drag.g;
    g.removeEventListener('pointermove', onMove);
    g.removeEventListener('pointerup', onUp);
    g.removeEventListener('pointercancel', onUp);
    g.removeEventListener('lostpointercapture', onUp);
    var moved = drag.moved;
    drag = null;
    if (moved) { refresh(); save(); }
  }

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === '+' || e.key === '=') { zoomBy(1.4); return; }
    if (e.key === '-') { zoomBy(1 / 1.4); return; }
    var p = selected ? byId[selected] : null;
    if (!p || p.removed) return;
    var k = e.key, step = e.shiftKey ? 6 : 1;
    if (k === 'r' || k === 'R') { e.preventDefault(); rotate(p); }
    else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); removePiece(p); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      if (k === 'ArrowLeft') p.x -= step;
      if (k === 'ArrowRight') p.x += step;
      if (k === 'ArrowUp') p.y -= step;
      if (k === 'ArrowDown') p.y += step;
      clamp(p);
      nodes[p.id].setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ')');
      refresh(); save();
    }
  });

  /* ---------- save / reset ---------- */
  function save() {
    try {
      var out = {};
      pieces.forEach(function (p) { out[p.id] = { x: p.x, y: p.y, w: p.w, h: p.h, r: p.removed ? 1 : 0, s: p.door ? p.door.side : 0 }; });
      localStorage.setItem(STORE, JSON.stringify(out));
    } catch (err) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var d = JSON.parse(raw);
      pieces.forEach(function (p) {
        var s = d && d[p.id];
        if (!s) return;
        var okNum = function (v) { return typeof v === 'number' && isFinite(v); };
        if (okNum(s.x) && okNum(s.y) && okNum(s.w) && okNum(s.h)) {
          var def = defById[p.id];
          var sameShape = (s.w === def.w && s.h === def.h) || (s.w === def.h && s.h === def.w);
          if (sameShape) { p.w = s.w; p.h = s.h; p.x = s.x; p.y = s.y; clamp(p); }
        }
        p.removed = s.r === 1;
        if (p.door && /^[btlr]$/.test(s.s)) p.door.side = s.s;
      });
    } catch (err) {}
  }

  var resetBtn = document.getElementById('reset');
  var resetTimer = null;
  resetBtn.addEventListener('click', function () {
    if (!resetTimer) {
      resetBtn.textContent = 'Click again to reset';
      resetBtn.classList.add('danger');
      resetTimer = setTimeout(function () { resetBtn.textContent = 'Reset layout'; resetBtn.classList.remove('danger'); resetTimer = null; }, 3000);
      return;
    }
    clearTimeout(resetTimer); resetTimer = null;
    resetBtn.textContent = 'Reset layout'; resetBtn.classList.remove('danger');
    pieces.forEach(function (p) {
      var d = defById[p.id];
      p.w = d.w; p.h = d.h; p.x = d.x; p.y = d.y; p.removed = false;
      if (d.door) p.door.side = d.door.side;
      drawPiece(p);
    });
    selected = null;
    refresh(); save();
  });

  /* ---------- zoom and pan ---------- */
  var BASE = { x: -18, y: -22, w: 267, h: 334 };
  var view = { z: 1, cx: BASE.x + BASE.w / 2, cy: BASE.y + BASE.h / 2 };
  function applyView() {
    // The view always matches the shape of the plan area, so zooming in uses all of it.
    var ew = svg.clientWidth || BASE.w, eh = svg.clientHeight || BASE.h;
    var A = ew / eh, bw, bh;
    if (A > BASE.w / BASE.h) { bh = BASE.h; bw = bh * A; } else { bw = BASE.w; bh = bw / A; }
    var w = bw / view.z, h = bh / view.z;
    function keep(c, size, min, len) {
      return size >= len ? min + len / 2 : Math.max(min + size / 2, Math.min(min + len - size / 2, c));
    }
    view.cx = keep(view.cx, w, BASE.x, BASE.w);
    view.cy = keep(view.cy, h, BASE.y, BASE.h);
    svg.setAttribute('viewBox', (view.cx - w / 2) + ' ' + (view.cy - h / 2) + ' ' + w + ' ' + h);
    document.getElementById('zlabel').textContent = Math.round(view.z * 100) + '%';
  }
  function zoomBy(f) {
    view.z = Math.max(1, Math.min(5, view.z * f));
    if (view.z < 1.02) view.z = 1;
    applyView();
  }
  document.getElementById('zin').addEventListener('click', function () { zoomBy(1.4); });
  document.getElementById('zout').addEventListener('click', function () { zoomBy(1 / 1.4); });
  document.getElementById('zfit').addEventListener('click', function () {
    view.z = 1; view.cx = BASE.x + BASE.w / 2; view.cy = BASE.y + BASE.h / 2; applyView();
  });

  // Stop the page from scrolling while a piece is dragged or the plan is panned by touch (Safari ignores touch-action on SVG shapes).
  svg.addEventListener('touchmove', function (e) { if (drag || pan) e.preventDefault(); }, { passive: false });

  svg.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.piece')) return;
    if (selected) { var prev = selected; selected = null; updateClasses(byId[prev]); renderSel(); renderList(); }
    if (view.z > 1) {
      pan = { sx: e.clientX, sy: e.clientY, cx: view.cx, cy: view.cy };
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  svg.addEventListener('pointermove', function (e) {
    if (!pan) return;
    var k = svg.getScreenCTM().a;
    view.cx = pan.cx - (e.clientX - pan.sx) / k;
    view.cy = pan.cy - (e.clientY - pan.sy) / k;
    applyView();
  });
  function endPan() { pan = null; }
  svg.addEventListener('pointerup', endPan);
  svg.addEventListener('pointercancel', endPan);

  drawStatic();
  load();
  buildPieces();
  drawOver();
  refresh();
  applyView();
  window.addEventListener('resize', applyView);
})();
</script>
</body>
</html>
